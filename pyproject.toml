[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-made-easy"
version = "0.1.0"
description = "AI Made Easy - a visual block-based AI model builder: design, train, and export PyTorch/Keras code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Made Easy" }]
dependencies = [
    "PySide6>=6.6",
    "OdenGraphQt>=0.7",
    "Jinja2>=3.1",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
tensorflow = ["tensorflow>=2.15"]
llm = [
    "transformers>=4.40",
    "datasets>=2.19",
    "peft>=0.11",
    "tokenizers>=0.19",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
mcp-server = ["mcp[cli]>=1.0,<2"]

[project.scripts]
aime = "ai_made_easy.cli:main"
aime-mcp = "ai_made_easy.mcp.server:main"

[tool.setuptools.packages.find]
include = ["ai_made_easy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
