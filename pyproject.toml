[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-made-easy"
version = "2.0.0"
description = "Visual model builder: design neural networks and classic ML pipelines, train them, and export clean PyTorch, Keras and scikit-learn code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Made Easy" }]
dependencies = [
    "PySide6>=6.6",
    "OdenGraphQt>=0.7",
    "Jinja2>=3.1",
    "pyqtgraph>=0.13",
    # OdenGraphQt imports `distutils`, removed from the stdlib in Python
    # 3.12 — setuptools ships the shim that keeps that import working.
    "setuptools>=68",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
tensorflow = ["tensorflow>=2.15"]
llm = [
    "transformers>=4.40",
    "datasets>=2.19",
    "peft>=0.11",
    "tokenizers>=0.19",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]
vision = ["torchvision>=0.17", "pillow>=10"]
# detection / segmentation / keypoints: timm + Hugging Face models, COCO RLE masks
# scipy: DETR's Hungarian matching loss
vision-tasks = ["torchvision>=0.23", "pillow>=10", "timm>=1.0", "transformers>=4.45",
                "pycocotools>=2.0", "scipy>=1.10"]
# speech encoders (wav2vec 2.0, HuBERT, WavLM, Whisper)
audio = ["transformers>=4.45"]
# graphical models, HMMs, Bayesian models (pgmpy, hmmlearn, PyMC)
probabilistic = ["pgmpy>=1.1", "hmmlearn>=0.3", "pymc>=5.16", "pandas>=2.0", "scipy>=1.10",
                 "pillow>=10"]
data = ["pandas>=2.0", "pyarrow>=14", "openpyxl>=3.1"]
classic = ["scikit-learn>=1.4", "joblib>=1.3", "xgboost>=2.0", "lightgbm>=4.0",
           "catboost>=1.2", "pandas>=2.0"]
keras = ["keras>=3.6"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1", "skl2onnx>=1.17"]
tuning = ["optuna>=3.6"]
web = ["ai-made-easy[serve]"]
all = ["ai-made-easy[torch,vision,vision-tasks,audio,probabilistic,data,classic,keras,llm,mcp-server,serve,export,tuning]"]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pillow>=10", "ruff>=0.6", "httpx>=0.27"]
perception = ["sounddevice>=0.4"]
mcp-server = ["mcp[cli]>=1.0,<2"]

[project.gui-scripts]
ai-made-easy = "ai_made_easy.__main__:main"

[project.scripts]
aime = "ai_made_easy.cli:main"
aime-mcp = "ai_made_easy.mcp.server:main"

[tool.setuptools.packages.find]
include = ["ai_made_easy*"]

[tool.setuptools.package-data]
ai_made_easy = ["samples/*.json", "assets/*", "core/zoo/*.json", "core/devices.json", "server/static/*", "server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/golden", "reference", "exports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
