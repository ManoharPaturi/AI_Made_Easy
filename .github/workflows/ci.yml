name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ai_made_easy scripts tests

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries for headless Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: OpenMP runtime for XGBoost / LightGBM
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,classic,keras,mcp-server,serve,export,tuning]" pandas
      - name: Test
        run: pytest -q -p no:cacheprovider
      - name: Every sample and recipe validates and generates code
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/sweep_e2e.py

  test-vision:
    # the vision-tasks extra (timm, transformers, pycocotools): every vision block and
    # training loop runs offline with random weights
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,vision-tasks,generative,serve]"
      - name: Test
        run: >-
          pytest -q -p no:cacheprovider tests/test_vision.py
          tests/test_codegen_runtime.py -k "vision or exercised or Vision"
      - name: Pretrained image recipes (random weights)
        run: pytest -q -p no:cacheprovider tests/test_pretrained_recipes.py -k "image or budget"
      - name: Detectors from blocks, Mask2Former, Stable Diffusion LoRA (tiny, offline)
        run: >-
          pytest -q -p no:cacheprovider tests/test_block_coverage.py
          -k "yolo or mask2former or stable_diffusion or inception or every_layer"

  test-probabilistic:
    # the probabilistic extra: graphical models, HMMs and their generated scripts
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,probabilistic,serve]"
      - name: Test
        run: pytest -q -p no:cacheprovider tests/test_pgm.py tests/test_ppl.py tests/test_gp.py tests/test_ssm.py
      - name: Your series and grouped tables
        run: pytest -q -p no:cacheprovider tests/test_your_data.py -k "series_recipes or grouped_table"
      - name: MvNormal / LKJ, MMHC, time-varying coefficients
        run: >-
          pytest -q -p no:cacheprovider tests/test_block_coverage.py
          -k "multivariate or lkj or mmhc or time_varying"

  test-graph-rl:
    # the graph and rl extras: PyTorch Geometric, Gymnasium and stable-baselines3
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,graph,rl,rl-box2d,serve]"
      - name: Test
        run: >-
          pytest -q -p no:cacheprovider tests/test_gnn.py tests/test_rl.py
          tests/test_codegen_runtime.py -k "graph or exercised"
      - name: Your graphs and interaction tables
        run: pytest -q -p no:cacheprovider tests/test_your_data.py -k "recommender_and_graph"
      - name: CNN policies on pixels and Box2D
        run: >-
          pytest -q -p no:cacheprovider tests/test_block_coverage.py
          -k "pixel or cnn_policy or lunar"

  test-audio:
    # the audio extra (Hugging Face speech encoders): speech and sequence blocks, their
    # training loops and serving, offline with random weights
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,audio,text,serve]" pandas
      - name: Test
        run: >-
          pytest -q -p no:cacheprovider tests/test_speech.py tests/test_sequence.py
          tests/test_codegen_runtime.py -k "audio or exercised or hf_text"
      - name: Pretrained text and audio recipes (random weights)
        run: pytest -q -p no:cacheprovider tests/test_pretrained_recipes.py -k "not image"
      - name: AST filterbanks
        run: pytest -q -p no:cacheprovider tests/test_block_coverage.py -k "test_ast"

  web:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Committed bundle is up to date
        run: git diff --exit-code --stat -- ai_made_easy/server/static
      - name: Install the server
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
          # pillow: image dataset profiles; scikit-learn: the demo tables the recipes use
          pip install -e ".[serve,data]" pillow scikit-learn
          # torch: the multi-objective AutoML smoke test trains the neural recipes
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Browser smoke tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          AIME_BIN=aime npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the web server image
        run: docker build -t ai-made-easy .
      - name: Container serves the UI and API
        run: |
          docker run -d --name aime -p 8765:8765 -e AIME_WEB_TOKEN=ci-token ai-made-easy
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/info && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/blocks)" = 401
          curl -sf -H "Authorization: Bearer ci-token" http://127.0.0.1:8765/api/blocks > /dev/null
          docker logs aime | tail -20
      - name: Every model family's libraries are in the image
        run: |
          docker run --rm ai-made-easy python -c "
          from ai_made_easy.core.registry import get_registry
          from ai_made_easy.core.spec import missing_requirements
          import ai_made_easy.core.blocks
          gaps = {b.type_id: missing_requirements(b) for b in get_registry().all()
                  if missing_requirements(b) and not b.type_id.startswith('llm.')}
          assert not gaps, gaps
          print('all block requirements installed')"


  package:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" pillow
      - name: Build the desktop bundle
        run: bash scripts/build_app.sh
      - name: Bundle ships the package sources used by subprocesses
        run: |
          test -f "dist/AI Made Easy/_internal/ai_made_easy/core/importers/onnx_import.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/worker/train_worker.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/core/pipelines/stages.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/samples/pipeline_distill_quantize.json"
      - name: The bundled app starts
        run: |
          export AIME_HOME="$(mktemp -d)"
          "dist/AI Made Easy/AI Made Easy" > app.log 2>&1 &
          PID=$!
          sleep 15
          kill -0 "$PID" || { cat app.log; exit 1; }
          kill "$PID"
