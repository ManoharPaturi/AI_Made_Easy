name: Nightly

# Everything the pull-request jobs leave out: every extra installed at once, and the
# opt-in tests that download real pretrained weights (torchvision, timm, Hugging Face).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# every job runs the whole suite, slow tests included (a plain local `pytest` leaves
# out tests/slow_tests.txt)
env:
  AIME_TESTS: all

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      QT_QPA_PLATFORM: offscreen
      KERAS_BACKEND: torch
      HAS_KAGGLE: ${{ secrets.KAGGLE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install every extra
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[all,dev]" pandas
      - name: Cache downloaded weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: weights-${{ hashFiles('ai_made_easy/core/zoo/*.json', 'scripts/verify_codegen.py') }}
      - name: Pretrained weights
        run: AIME_ONLINE=1 pytest -q -p no:cacheprovider tests/test_online.py
      - name: Full suite with every extra
        run: pytest -q -p no:cacheprovider
      - name: Every sample and recipe trains and deploys
        run: python scripts/sweep_e2e.py --train --deploy --online --json sweep.json
      - name: A real Kaggle kernel (only when the KAGGLE_KEY secret is set)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        if: env.HAS_KAGGLE == 'true'
        run: |
          pip install -e ".[kaggle]"
          AIME_ONLINE=1 pytest -q -p no:cacheprovider tests/test_backends.py -k real_kaggle
          AIME_ONLINE=1 pytest -q -p no:cacheprovider tests/test_integrations.py -k real_kaggle
      - name: A real OGB benchmark (ogbg-molbace) with its official evaluator
        run: AIME_ONLINE=1 pytest -q -p no:cacheprovider tests/test_deferred.py -k real_ogb
      - name: Real Hub datasets, and a Hub push when HF_TOKEN / AIME_HF_TEST_REPO are set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AIME_HF_TEST_REPO: ${{ vars.AIME_HF_TEST_REPO }}
        run: AIME_ONLINE=1 pytest -q -p no:cacheprovider tests/test_integrations.py -k "real_hub"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-report
          path: sweep.json
          if-no-files-found: ignore
