name: Nightly

# Everything the pull-request jobs leave out: every extra installed at once, and the
# opt-in tests that download real pretrained weights (torchvision, timm, Hugging Face).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      QT_QPA_PLATFORM: offscreen
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install every extra
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[all,dev]" pandas
      - name: Cache downloaded weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: weights-${{ hashFiles('ai_made_easy/core/zoo/*.json', 'scripts/verify_codegen.py') }}
      - name: Pretrained weights
        run: AIME_ONLINE=1 pytest -q -p no:cacheprovider tests/test_online.py
      - name: Full suite with every extra
        run: pytest -q -p no:cacheprovider
